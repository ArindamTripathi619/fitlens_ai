<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Body Image Upload</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#25c0f4",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101e22",
                        "surface-dark": "#18282d",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                    animation: {
                        'scan': 'scan 3s ease-in-out infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%, 100%': { transform: 'translateY(0)', opacity: '0.4' },
                            '50%': { transform: 'translateY(100%)', opacity: '1' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display min-h-screen flex flex-col items-center justify-center selection:bg-primary/30">
<!-- Mobile Container -->
<div class="relative flex h-full min-h-screen w-full max-w-md flex-col bg-background-light dark:bg-background-dark overflow-hidden shadow-2xl">
<!-- Top App Bar -->
<div class="z-20 flex items-center p-4 pt-6 pb-2 justify-between bg-transparent absolute top-0 w-full bg-gradient-to-b from-black/80 to-transparent">
<button class="text-white flex size-10 shrink-0 items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors backdrop-blur-md">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h2 class="text-white text-lg font-bold tracking-tight flex-1 text-center drop-shadow-md">Body Scan</h2>
<button class="text-white flex size-10 shrink-0 items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors backdrop-blur-md">
<span class="material-symbols-outlined text-[24px]">help</span>
</button>
</div>
<!-- Progress Indicators & Title Area -->
<div class="flex flex-col items-center w-full pt-20 pb-4 px-6 z-10">
<!-- Stepper -->
<div class="flex w-full flex-row items-center justify-center gap-2 mb-3">
<div class="h-1.5 w-8 rounded-full bg-primary shadow-[0_0_10px_rgba(37,192,244,0.6)]"></div>
<div class="h-1.5 w-2 rounded-full bg-white/20"></div>
</div>
<h1 class="text-3xl font-bold text-center tracking-tight mb-1 dark:text-white">Front View</h1>
<p class="text-sm text-center text-slate-500 dark:text-slate-400 font-body max-w-[280px]">Align your body with the blue outline. Wear fitted clothes.</p>
</div>
<!-- Camera Viewport -->
<div class="flex-1 relative w-full px-4 mb-4 flex flex-col justify-center">
<!-- Viewfinder Frame -->
<div class="relative w-full aspect-[3/4] bg-surface-dark rounded-[2.5rem] overflow-hidden border-2 border-white/10 shadow-2xl group">
<!-- Placeholder Image (Simulated Camera Feed) -->
<div class="absolute inset-0 bg-cover bg-center opacity-60" data-alt="Abstract silhouette of a person standing in a dimly lit room, simulating a camera feed awaiting focus" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDpJ3jMQPa421gknAlSf3CKyE_cPfu4CnPEha5tFHkJvBwA0JRpaZbLS6Ks9RtxdHHccgbdO0Gq4_4uc53SMNkIbklEF9S04FJwAZ8BE-GIdncihs4td7RF4SSq6_CYl-Q4_EfMcKuGEKVT3DkZIxa6Qk51zPU7a4LYs7Gd2tLi9SHTqoNMMxb-idGUYRpmRe0hnvT4wwSj8WoopAGzKVfMEQmkp9uuK_1p6Sxyit8ObuAnC2TxNeC3Tq9078wLq-L1Nosq9kWrcbE');">
</div>
<!-- Dark Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-t from-background-dark via-transparent to-transparent opacity-80"></div>
<!-- Ghost Overlay (Silhouette) -->
<div class="absolute inset-0 flex items-end justify-center pointer-events-none pb-0">
<svg class="h-[90%] w-auto opacity-70 drop-shadow-[0_0_8px_rgba(37,192,244,0.5)]" preserveaspectratio="xMidYMax meet" viewbox="0 0 200 400">
<path d="M100,20 C115,20 125,30 125,45 C125,60 115,70 100,70 C85,70 75,60 75,45 C75,30 85,20 100,20 M100,75 C130,75 155,90 160,130 L165,220 C166,230 155,235 150,225 L145,160 L140,280 L145,380 C146,390 130,395 125,380 L120,290 L100,290 L80,290 L75,380 C70,395 54,390 55,380 L60,280 L55,160 L50,225 C45,235 34,230 35,220 L40,130 C45,90 70,75 100,75" fill="none" stroke="#25c0f4" stroke-dasharray="8 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Scanning Line Animation -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="w-full h-[2px] bg-primary shadow-[0_0_20px_4px_rgba(37,192,244,0.6)] animate-scan relative top-0"></div>
</div>
<!-- Viewport Lighting/Environment Hint -->
<div class="absolute top-4 right-4 bg-black/40 backdrop-blur-md rounded-full px-3 py-1 flex items-center gap-1.5 border border-white/10">
<span class="material-symbols-outlined text-yellow-400 text-[16px]">light_mode</span>
<span class="text-xs font-medium text-white/90">Lighting Good</span>
</div>
</div>
</div>
<!-- Privacy & Actions Area -->
<div class="relative w-full px-6 pb-8 pt-2 flex flex-col gap-6 bg-background-light dark:bg-background-dark">
<!-- Privacy Badge (Trigger for Popup) -->
<div class="flex justify-center">
<button class="group flex items-center gap-2 px-4 py-1.5 rounded-full bg-primary/10 hover:bg-primary/20 transition-all border border-primary/20 cursor-pointer">
<span class="material-symbols-outlined text-primary text-[18px]">lock</span>
<span class="text-xs font-semibold text-primary tracking-wide">AI Private &amp; Secure</span>
</button>
</div>
<!-- Controls Grid -->
<div class="grid grid-cols-3 items-center gap-4">
<!-- Gallery Upload -->
<div class="flex justify-start">
<button class="flex flex-col items-center justify-center size-14 rounded-2xl bg-surface-dark border border-white/5 hover:border-white/20 active:scale-95 transition-all group">
<span class="material-symbols-outlined text-white/70 group-hover:text-white text-[28px]">photo_library</span>
</button>
</div>
<!-- Shutter Button -->
<div class="flex justify-center relative">
<!-- Outer Glow Ring -->
<div class="absolute inset-0 rounded-full bg-primary/20 animate-pulse-slow blur-xl"></div>
<button class="relative size-20 rounded-full border-[4px] border-white flex items-center justify-center bg-transparent active:scale-95 transition-transform duration-100 shadow-[0_0_20px_rgba(255,255,255,0.15)] group">
<div class="size-16 rounded-full bg-white group-active:bg-primary transition-colors duration-200"></div>
</button>
</div>
<!-- Flip Camera -->
<div class="flex justify-end">
<button class="flex flex-col items-center justify-center size-14 rounded-2xl bg-surface-dark border border-white/5 hover:border-white/20 active:scale-95 transition-all group">
<span class="material-symbols-outlined text-white/70 group-hover:text-white text-[28px] transition-transform duration-500 group-active:rotate-180">flip_camera_ios</span>
</button>
</div>
</div>
</div>
<!-- Bottom Sheet / Privacy Popup (Visually present but styled as a contextual toast for this design) -->
<div class="absolute bottom-6 left-4 right-4 z-30 transform transition-transform duration-500 translate-y-0">
<div class="bg-[#18282d]/95 backdrop-blur-xl border border-white/10 p-4 rounded-2xl shadow-2xl flex items-start gap-3">
<div class="p-2 rounded-full bg-primary/20 text-primary shrink-0">
<span class="material-symbols-outlined text-[20px]">verified_user</span>
</div>
<div class="flex-1">
<h3 class="text-white text-sm font-bold mb-0.5">Privacy First</h3>
<p class="text-slate-400 text-xs leading-relaxed">Your photos are processed locally on your device and are never shared without permission.</p>
</div>
<button class="text-slate-400 hover:text-white p-1">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
</div>
</div>
</body></html>
