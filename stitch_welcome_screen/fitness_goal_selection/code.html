<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fitness Goal Selection</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6938fa",
                        "background-light": "#f6f5f8",
                        "background-dark": "#140f23",
                        "surface-dark": "#1e1a2e",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white transition-colors duration-300">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl">
<!-- Header & Progress -->
<header class="flex flex-col gap-6 px-6 pt-8 pb-2">
<!-- Navigation & Step Counter -->
<div class="flex items-center justify-between">
<button class="p-2 -ml-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">arrow_back</span>
</button>
<span class="text-xs font-semibold text-primary uppercase tracking-wider">Step 1 of 4</span>
<button class="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-primary transition-colors">Skip</button>
</div>
<!-- Segmented Progress Bar -->
<div class="flex w-full flex-row items-center gap-2">
<div class="h-1.5 flex-1 rounded-full bg-primary shadow-[0_0_10px_rgba(105,56,250,0.5)]"></div>
<div class="h-1.5 flex-1 rounded-full bg-slate-300 dark:bg-slate-700/50"></div>
<div class="h-1.5 flex-1 rounded-full bg-slate-300 dark:bg-slate-700/50"></div>
<div class="h-1.5 flex-1 rounded-full bg-slate-300 dark:bg-slate-700/50"></div>
</div>
<!-- Headline -->
<div class="mt-2">
<h1 class="text-[32px] font-bold leading-tight tracking-tight mb-2">
                    What is your <br/>
<span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-400">primary goal?</span>
</h1>
<p class="text-slate-500 dark:text-slate-400 text-base">We'll personalize your workout and diet plan based on your choice.</p>
</div>
</header>
<!-- Main Content: Goal Selection Cards -->
<main class="flex-1 flex flex-col gap-4 px-6 py-4 overflow-y-auto no-scrollbar pb-24">
<!-- Option 1: Lose Weight -->
<label class="group relative cursor-pointer">
<input checked="" class="peer sr-only" name="fitness_goal" type="radio" value="weight_loss"/>
<div class="relative flex items-center justify-between p-5 rounded-[2rem] bg-surface-light dark:bg-surface-dark border-2 border-transparent transition-all duration-300 ease-out hover:scale-[1.02] peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:shadow-[0_0_20px_rgba(105,56,250,0.15)] peer-focus:ring-2 peer-focus:ring-primary peer-focus:ring-offset-2 peer-focus:ring-offset-background-dark">
<div class="flex flex-col gap-1 z-10 max-w-[60%]">
<span class="text-lg font-bold group-hover:text-primary transition-colors">Lose Weight</span>
<span class="text-sm text-slate-500 dark:text-slate-400 font-medium leading-snug">Burn fat &amp; get lean with cardio focus.</span>
</div>
<!-- Visual Placeholder (simulating Lottie area) -->
<div class="h-16 w-16 rounded-2xl bg-gradient-to-br from-orange-400 to-pink-500 flex items-center justify-center shadow-lg transform group-hover:rotate-3 transition-transform" data-alt="Abstract gradient representing energy burning">
<span class="material-symbols-outlined text-white text-3xl">local_fire_department</span>
</div>
<!-- Selection Indicator (Checkmark) -->
<div class="absolute top-5 right-5 h-6 w-6 rounded-full bg-primary text-white opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-300 flex items-center justify-center shadow-md -mt-2 -mr-2">
<span class="material-symbols-outlined text-sm font-bold">check</span>
</div>
</div>
</label>
<!-- Option 2: Build Muscle -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="fitness_goal" type="radio" value="muscle_gain"/>
<div class="relative flex items-center justify-between p-5 rounded-[2rem] bg-surface-light dark:bg-surface-dark border-2 border-transparent transition-all duration-300 ease-out hover:scale-[1.02] peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:shadow-[0_0_20px_rgba(105,56,250,0.15)]">
<div class="flex flex-col gap-1 z-10 max-w-[60%]">
<span class="text-lg font-bold group-hover:text-primary transition-colors">Build Muscle</span>
<span class="text-sm text-slate-500 dark:text-slate-400 font-medium leading-snug">Gain mass &amp; strength with heavy lifting.</span>
</div>
<!-- Visual Placeholder -->
<div class="h-16 w-16 rounded-2xl bg-gradient-to-br from-blue-400 to-primary flex items-center justify-center shadow-lg transform group-hover:rotate-3 transition-transform" data-alt="Abstract gradient representing strength">
<span class="material-symbols-outlined text-white text-3xl">fitness_center</span>
</div>
<!-- Selection Indicator -->
<div class="absolute top-5 right-5 h-6 w-6 rounded-full bg-primary text-white opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-300 flex items-center justify-center shadow-md -mt-2 -mr-2">
<span class="material-symbols-outlined text-sm font-bold">check</span>
</div>
</div>
</label>
<!-- Option 3: Stay Fit / Maintenance -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="fitness_goal" type="radio" value="maintenance"/>
<div class="relative flex items-center justify-between p-5 rounded-[2rem] bg-surface-light dark:bg-surface-dark border-2 border-transparent transition-all duration-300 ease-out hover:scale-[1.02] peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:shadow-[0_0_20px_rgba(105,56,250,0.15)]">
<div class="flex flex-col gap-1 z-10 max-w-[60%]">
<span class="text-lg font-bold group-hover:text-primary transition-colors">Stay Fit</span>
<span class="text-sm text-slate-500 dark:text-slate-400 font-medium leading-snug">Maintain current weight &amp; tone up.</span>
</div>
<!-- Visual Placeholder -->
<div class="h-16 w-16 rounded-2xl bg-gradient-to-br from-teal-400 to-emerald-500 flex items-center justify-center shadow-lg transform group-hover:rotate-3 transition-transform" data-alt="Abstract gradient representing balance">
<span class="material-symbols-outlined text-white text-3xl">monitor_heart</span>
</div>
<!-- Selection Indicator -->
<div class="absolute top-5 right-5 h-6 w-6 rounded-full bg-primary text-white opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-300 flex items-center justify-center shadow-md -mt-2 -mr-2">
<span class="material-symbols-outlined text-sm font-bold">check</span>
</div>
</div>
</label>
<!-- Option 4: Flexibility (Extra Option for completeness) -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="fitness_goal" type="radio" value="flexibility"/>
<div class="relative flex items-center justify-between p-5 rounded-[2rem] bg-surface-light dark:bg-surface-dark border-2 border-transparent transition-all duration-300 ease-out hover:scale-[1.02] peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:shadow-[0_0_20px_rgba(105,56,250,0.15)]">
<div class="flex flex-col gap-1 z-10 max-w-[60%]">
<span class="text-lg font-bold group-hover:text-primary transition-colors">Improve Flexibility</span>
<span class="text-sm text-slate-500 dark:text-slate-400 font-medium leading-snug">Enhance mobility &amp; reduce stress.</span>
</div>
<!-- Visual Placeholder -->
<div class="h-16 w-16 rounded-2xl bg-gradient-to-br from-purple-400 to-indigo-500 flex items-center justify-center shadow-lg transform group-hover:rotate-3 transition-transform" data-alt="Abstract gradient representing flexibility">
<span class="material-symbols-outlined text-white text-3xl">self_improvement</span>
</div>
<!-- Selection Indicator -->
<div class="absolute top-5 right-5 h-6 w-6 rounded-full bg-primary text-white opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-300 flex items-center justify-center shadow-md -mt-2 -mr-2">
<span class="material-symbols-outlined text-sm font-bold">check</span>
</div>
</div>
</label>
</main>
<!-- Sticky Footer -->
<div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark dark:to-transparent z-20 max-w-md mx-auto">
<button class="w-full flex cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 px-8 bg-primary text-white text-lg font-bold leading-normal tracking-wide shadow-[0_8px_20px_rgba(105,56,250,0.4)] hover:shadow-[0_12px_24px_rgba(105,56,250,0.6)] hover:bg-primary/90 active:scale-95 transition-all duration-200">
<span class="truncate">Next Step</span>
<span class="material-symbols-outlined ml-2">arrow_forward</span>
</button>
</div>
</div>
</body></html>
