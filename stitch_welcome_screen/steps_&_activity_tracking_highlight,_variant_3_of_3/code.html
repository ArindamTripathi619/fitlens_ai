<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Steps &amp; Activity Tracking Highlight</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#794dff",
                        "background-light": "#f6f5f8",
                        "background-dark": "#140f23",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white antialiased">
<!-- Main Container -->
<div class="relative flex h-screen w-full flex-col overflow-hidden bg-background-dark">
<!-- Background Image Layer -->
<!-- Using a high quality image of a runner to set the energetic tone -->
<div class="absolute inset-0 z-0 h-full w-full bg-cover bg-center transition-transform duration-700 ease-out scale-105" data-alt="Young energetic man running outdoors in a park setting, wearing athletic gear" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB4kkBpThscKyliVjLRxuob-VA2oDBTLgLqCWySexGTVsCdWgXo2eaikRdGjhGIRYD8mSmg-kWcdxslc2jcSOToyXLJWKlmu0ifFuqHNx3QBglFYnLdbMQxDVs7VWEGVnp33UOIEB0AE2gkr9hJ9Vd969HUht93gscRhkZhb1waaW4JtLwCyMNWRTY6gy40B-Gg_M8XFgs7vFSiLKGYp67iL1i8-uPhLuZ-HBausCpbgA9I9yCDa7CwjPaVJXJa00sMRuPR1ykE7T8');">
<!-- Gradient Overlay: Ensures text/card contrast while maintaining image visibility -->
<!-- Adjusted to be darker at bottom to blend with the card if needed, though card is opaque here -->
<div class="absolute inset-0 bg-gradient-to-b from-black/10 via-black/20 to-black/60"></div>
</div>
<!-- Top Status Area (Placeholder for system UI spacing) -->
<div class="relative z-10 w-full pt-14 px-6 flex justify-between items-center opacity-80">
<!-- Optional: skip button or logo could go here -->
</div>
<!-- Bottom Content Area -->
<div class="relative z-10 mt-auto flex w-full flex-col items-center justify-end p-4 pb-6 safe-area-bottom">
<!-- Floating Content Card -->
<!-- Using rounded-xl (3rem) for distinct modern rounded look requested -->
<div class="relative w-full max-w-md overflow-visible rounded-xl bg-background-light dark:bg-background-dark shadow-2xl ring-1 ring-white/10">
<!-- Floating Icon: Positioned to overlap the top edge of the card -->
<div class="absolute -top-10 left-1/2 -translate-x-1/2 transform">
<div class="flex h-20 w-20 items-center justify-center rounded-full bg-primary shadow-[0_8px_16px_rgba(121,77,255,0.3)] ring-8 ring-background-light dark:ring-background-dark">
<span class="material-symbols-outlined text-[40px] text-white">
                            footprint
                        </span>
</div>
</div>
<div class="flex flex-col items-center px-6 pt-14 pb-8 text-center">
<!-- Pagination Indicators -->
<div class="mb-6 flex flex-row items-center justify-center gap-2">
<div class="h-2 w-2 rounded-full bg-gray-300 dark:bg-gray-700 transition-colors"></div>
<div class="h-2 w-2 rounded-full bg-gray-300 dark:bg-gray-700 transition-colors"></div>
<!-- Active indicator is elongated (pill shape) and primary color -->
<div class="h-2 w-8 rounded-full bg-primary shadow-[0_0_8px_rgba(121,77,255,0.5)]"></div>
</div>
<!-- Typography -->
<div class="mb-8 flex flex-col gap-3">
<h1 class="text-3xl font-extrabold tracking-tight text-gray-900 dark:text-white sm:text-4xl">
                            Move More, <br/><span class="text-primary">Stress Less</span>
</h1>
<p class="text-base font-medium leading-relaxed text-gray-500 dark:text-gray-400">
                            Our AI automatically logs your daily walks and runs. Hit your goals without draining your battery.
                        </p>
</div>
<!-- Primary Action Button -->
<button class="group relative flex h-14 w-full cursor-pointer items-center justify-center overflow-hidden rounded-full bg-primary shadow-[0_4px_14px_rgba(121,77,255,0.4)] transition-transform active:scale-[0.98]">
<div class="absolute inset-0 bg-white/20 opacity-0 transition-opacity group-hover:opacity-100"></div>
<span class="z-10 text-base font-bold text-white tracking-wide">Let's Start</span>
<span class="material-symbols-outlined z-10 ml-2 text-xl text-white transition-transform duration-300 group-hover:translate-x-1">
                            arrow_forward
                        </span>
</button>
</div>
</div>
</div>
</div>
</body></html>
