<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Food Analyzer Highlight</title>
<!-- Material Symbols Link -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#794dff",
                        "background-light": "#f6f5f8",
                        "background-dark": "#140f23",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
        
        body {
            font-family: 'Inter', "Noto Sans", sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black flex justify-center items-center min-h-screen">
<!-- Mobile Screen Container -->
<div class="relative flex h-screen w-full max-w-[480px] flex-col bg-background-light dark:bg-background-dark overflow-hidden shadow-2xl">

<div class="absolute top-0 left-0 w-full h-[65%] z-0">
<div class="w-full h-full bg-cover bg-center" data-alt="Top-down view of a delicious healthy Indian thali meal with lentils, vegetables, and rice" style='background-image: linear-gradient(180deg, rgba(20, 15, 35, 0.2) 0%, rgba(20, 15, 35, 0.0) 50%, rgba(20, 15, 35, 1) 100%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuAyaYAVEIheAxHMcTvFA6J443v1gIySIjD759NsC3E980iQC2W45smlQBdmkfHmTSeQ5QPXEGQ900hv4P-GM92Zk80f0LaU6FMQgVZYvQVoQjsmu0cC-13T-WkLY7NioiwKaEWlLzSQnm4NZ6lFXNvmp1nneYBCc6QBSf2Qsn6kPBqsVImS8AJId6crefMvihNobCWQM0nupsp94UwhlgzeWiGwOTRBiIcw6jT4KSouXXNoZ0KMiwUxo-BY7rtAY-lIIsO8UObQ2wQ");'>
</div>
<!-- AR Scan Overlay Element (Simulating AI Detection) -->
<div class="absolute top-[40%] left-[50%] translate-x-[-50%] translate-y-[-50%]">
<!-- Focus Bracket Corners -->
<div class="absolute -top-4 -left-4 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg opacity-80"></div>
<div class="absolute -top-4 -right-4 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg opacity-80"></div>
<div class="absolute -bottom-4 -left-4 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg opacity-80"></div>
<div class="absolute -bottom-4 -right-4 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg opacity-80"></div>
<!-- Floating Tag -->
<div class="relative bg-background-dark/80 backdrop-blur-md border border-primary/50 text-white rounded-full p-1 pr-4 flex items-center gap-3 shadow-[0_4px_20px_rgba(121,77,255,0.4)]">
<div class="h-10 w-10 bg-primary rounded-full flex items-center justify-center text-white">
<span class="material-symbols-outlined text-xl">restaurant</span>
</div>
<div class="flex flex-col">
<span class="text-xs font-bold tracking-wide">Lentils &amp; Veggies</span>
<span class="text-[10px] text-gray-300 font-medium">320 kcal • 18g Protein</span>
</div>
</div>
</div>
</div>
<!-- Top Header Area -->
<div class="relative z-10 w-full p-6 pt-12 flex justify-end">
<button class="text-white/80 text-sm font-medium hover:text-white transition-colors bg-black/20 backdrop-blur-sm px-4 py-2 rounded-full">
                Skip
            </button>
</div>
<!-- Bottom Sheet Content -->
<div class="absolute bottom-0 w-full z-10 flex flex-col justify-end">
<!-- Glassmorphism Gradient Fade -->
<div class="h-20 w-full bg-gradient-to-b from-transparent to-background-dark"></div>
<div class="bg-background-dark rounded-t-[2.5rem] px-8 pb-10 pt-8 w-full shadow-[0_-10px_60px_rgba(0,0,0,0.5)] border-t border-white/5">
<!-- Handle Bar Decorative -->
<div class="w-full flex justify-center mb-6 opacity-20">
<div class="w-12 h-1.5 bg-white rounded-full"></div>
</div>
<!-- Headline -->
<h1 class="text-white tracking-tight text-[32px] font-extrabold leading-[1.1] text-center mb-4">
                    Instant Food<br/>Recognition
                </h1>

<p class="text-gray-400 text-base font-normal leading-relaxed text-center mb-10 max-w-[320px] mx-auto">

                </p>
<!-- Navigation & Controls -->
<div class="flex items-center justify-between mt-auto">
<!-- Dot Indicators -->
<div class="flex gap-2.5 items-center">
<div class="w-8 h-2.5 bg-primary rounded-full shadow-[0_0_10px_rgba(121,77,255,0.5)]"></div>
<div class="w-2.5 h-2.5 bg-white/20 rounded-full"></div>
<div class="w-2.5 h-2.5 bg-white/20 rounded-full"></div>
</div>
<!-- Next Action Button -->
<button class="group flex items-center justify-center w-16 h-16 bg-primary text-white rounded-full shadow-[0_4px_20px_rgba(121,77,255,0.4)] hover:bg-[#6b42e0] transition-colors">
<span class="material-symbols-outlined text-3xl group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</div>
</div>
