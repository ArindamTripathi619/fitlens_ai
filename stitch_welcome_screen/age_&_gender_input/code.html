<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Age &amp; Gender Input</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6938fa",
                        "background-light": "#f6f5f8",
                        "background-dark": "#140f23",
                        "surface-dark": "#2c273a",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Inter", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Hide scrollbar for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Custom wheel picker styles */
        .wheel-mask {
            background: linear-gradient(to bottom, 
                rgba(20, 15, 35, 1) 0%, 
                rgba(20, 15, 35, 0.1) 40%, 
                rgba(20, 15, 35, 0.1) 60%, 
                rgba(20, 15, 35, 1) 100%
            );
        }
        /* Light mode mask variant */
        :not(.dark) .wheel-mask {
             background: linear-gradient(to bottom, 
                rgba(246, 245, 248, 1) 0%, 
                rgba(246, 245, 248, 0.1) 40%, 
                rgba(246, 245, 248, 0.1) 60%, 
                rgba(246, 245, 248, 1) 100%
            );
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-white">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl">
<!-- Header with Back Button and Progress -->
<header class="flex items-center justify-between px-4 py-6 sticky top-0 z-20 bg-background-light dark:bg-background-dark bg-opacity-95 backdrop-blur-sm">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-row items-center justify-center gap-2">
<div class="h-1.5 w-8 rounded-full bg-primary/30"></div>
<div class="h-1.5 w-8 rounded-full bg-primary shadow-[0_0_10px_rgba(105,56,250,0.5)]"></div>
<div class="h-1.5 w-8 rounded-full bg-primary/30"></div>
<div class="h-1.5 w-8 rounded-full bg-primary/30"></div>
<div class="h-1.5 w-8 rounded-full bg-primary/30"></div>
</div>
<div class="size-10"></div> <!-- Spacer for alignment -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-6 pb-24">
<!-- Section 1: Gender -->
<div class="flex flex-col gap-6 animate-fade-in-up">
<div class="space-y-2 text-center">
<!-- Illustration placeholder -->
<div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gradient-to-tr from-primary/20 to-pink-500/20 flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 opacity-30 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] mix-blend-overlay"></div>
<span class="material-symbols-outlined text-4xl text-primary">face_6</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Tell us about you</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm">To give you the best recommendations, we need to know a little bit about who you are.</p>
</div>
<div class="grid grid-cols-2 gap-4 mt-2">
<!-- Male Option -->
<label class="group relative flex cursor-pointer flex-col items-center justify-center gap-3 rounded-2xl border-2 border-transparent bg-white dark:bg-surface-dark p-6 transition-all duration-300 hover:scale-[1.02] has-[:checked]:border-primary has-[:checked]:bg-primary/10 has-[:checked]:shadow-[0_4px_20px_-4px_rgba(105,56,250,0.3)]">
<input class="peer sr-only" name="gender" type="radio" value="male"/>
<div class="flex h-12 w-12 items-center justify-center rounded-full bg-slate-100 dark:bg-white/5 text-slate-400 peer-checked:bg-primary peer-checked:text-white transition-colors duration-300">
<span class="material-symbols-outlined text-2xl">male</span>
</div>
<span class="font-semibold text-slate-600 dark:text-slate-300 peer-checked:text-primary dark:peer-checked:text-white">Male</span>
</label>
<!-- Female Option -->
<label class="group relative flex cursor-pointer flex-col items-center justify-center gap-3 rounded-2xl border-2 border-transparent bg-white dark:bg-surface-dark p-6 transition-all duration-300 hover:scale-[1.02] has-[:checked]:border-primary has-[:checked]:bg-primary/10 has-[:checked]:shadow-[0_4px_20px_-4px_rgba(105,56,250,0.3)]">
<input checked="" class="peer sr-only" name="gender" type="radio" value="female"/>
<div class="flex h-12 w-12 items-center justify-center rounded-full bg-slate-100 dark:bg-white/5 text-slate-400 peer-checked:bg-primary peer-checked:text-white transition-colors duration-300">
<span class="material-symbols-outlined text-2xl">female</span>
</div>
<span class="font-semibold text-slate-600 dark:text-slate-300 peer-checked:text-primary dark:peer-checked:text-white">Female</span>
</label>
<!-- Other Option - Spanning full width if needed, or keeping grid -->
<label class="col-span-2 group relative flex cursor-pointer flex-row items-center justify-center gap-3 rounded-2xl border-2 border-transparent bg-white dark:bg-surface-dark p-4 transition-all duration-300 hover:scale-[1.01] has-[:checked]:border-primary has-[:checked]:bg-primary/10 has-[:checked]:shadow-[0_4px_20px_-4px_rgba(105,56,250,0.3)]">
<input class="peer sr-only" name="gender" type="radio" value="other"/>
<div class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-100 dark:bg-white/5 text-slate-400 peer-checked:bg-primary peer-checked:text-white transition-colors duration-300">
<span class="material-symbols-outlined text-lg">wc</span>
</div>
<span class="font-semibold text-slate-600 dark:text-slate-300 peer-checked:text-primary dark:peer-checked:text-white">Prefer not to say / Other</span>
</label>
</div>
</div>
<div class="my-8 h-px w-full bg-slate-200 dark:bg-white/10"></div>
<!-- Section 2: Age -->
<div class="flex flex-col gap-6 items-center">
<h2 class="text-xl font-bold text-slate-900 dark:text-white">How old are you?</h2>
<div class="relative h-48 w-full max-w-[200px] overflow-hidden">
<!-- Selection Indicator Line -->
<div class="absolute top-1/2 left-0 w-full -translate-y-1/2 h-14 border-y border-primary/30 bg-primary/5 z-0 pointer-events-none rounded-lg"></div>
<div class="absolute top-1/2 left-2 -translate-y-1/2 text-primary font-bold text-xs">YRS</div>
<!-- Scrollable Numbers -->
<div class="h-full w-full overflow-y-auto no-scrollbar snap-y snap-mandatory py-[calc(50%-1.75rem)] text-center relative z-10">
<!-- Numbers from 16 to 40 generated conceptually -->
<!-- Padding item -->
<div class="h-14 flex items-center justify-center snap-center opacity-30 text-2xl font-medium">17</div>
<div class="h-14 flex items-center justify-center snap-center opacity-40 text-2xl font-medium">18</div>
<div class="h-14 flex items-center justify-center snap-center opacity-60 text-3xl font-medium">19</div>
<!-- Selected Item -->
<div class="h-14 flex items-center justify-center snap-center text-primary text-5xl font-bold scale-110 origin-center transition-transform">20</div>
<div class="h-14 flex items-center justify-center snap-center opacity-60 text-3xl font-medium">21</div>
<div class="h-14 flex items-center justify-center snap-center opacity-40 text-2xl font-medium">22</div>
<div class="h-14 flex items-center justify-center snap-center opacity-30 text-2xl font-medium">23</div>
<div class="h-14 flex items-center justify-center snap-center opacity-20 text-xl font-medium">24</div>
</div>
<!-- Top and Bottom Fade Masks -->
<div class="absolute inset-0 pointer-events-none wheel-mask z-20"></div>
</div>
</div>
</main>
<!-- Sticky Footer Action -->
<div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark dark:to-transparent z-30 max-w-md mx-auto">
<button class="group w-full flex items-center justify-center gap-2 rounded-full bg-primary py-4 text-white font-bold text-lg shadow-[0_4px_14px_0_rgba(105,56,250,0.39)] transition-all hover:bg-primary/90 hover:shadow-[0_6px_20px_rgba(105,56,250,0.23)] active:scale-[0.98]">
                Next Step
                <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</div>
</body></html>
