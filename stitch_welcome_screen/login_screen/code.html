<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Screen</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Poppins:wght@600&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7e55f6",
                        "background-light": "#f6f5f8",
                        "background-dark": "#141022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "heading": ["Poppins", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar hide for cleaner look if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-white min-h-screen flex items-center justify-center overflow-hidden relative">
<!-- Background Image with Blur -->
<div class="absolute inset-0 z-0 w-full h-full">
<div class="w-full h-full bg-cover bg-center" data-alt="Abstract blurred view of a gym interior with warm lighting" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC5POvqOh8zIYdbb48MQG7Sa4UmGiQvu9DYS1ZYh7GoVrTCV83LwFDfRrkHpsxR-dOd6k6g-COsdQy0QqoCcy0WjskuILOTZWPdXHW2nhq_U7lWHG7U-KaQwE7q54zuGrJS5NHZrE7FIDmMUaHJ7fNtcd_JHPwQrEo0CwrXRKochwBTA6B5ijA4Uj3szEj01Ijh5toeSaobSAG-tooG8h28e0LYHqfD-ofvvb3r4pcpBsDiaSrWfL3UqdGWTlnisqDue7JLWl0TDgA'); filter: blur(8px); -webkit-filter: blur(8px);">
</div>
<!-- Dark Overlay Gradient -->
<div class="absolute inset-0 bg-background-dark/80 bg-gradient-to-t from-background-dark via-background-dark/70 to-transparent"></div>
</div>
<!-- Main Content Card -->
<main class="relative z-10 w-full max-w-md p-4 animate-fade-in-up">
<div class="w-full bg-[#1e1b27]/60 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-6 sm:p-8 flex flex-col gap-6">
<!-- Headline -->
<div class="text-center space-y-2">
<h1 class="font-heading text-3xl font-semibold text-white tracking-tight">Welcome Back</h1>
<p class="text-gray-400 text-sm font-medium">Let's hit those goals today.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<!-- Email/Phone Field -->
<div class="flex flex-col gap-1">
<label class="sr-only" for="email">Email or Phone Number</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#a39cba] group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="form-input block w-full rounded-xl bg-[#141022] border-transparent focus:border-primary focus:ring-0 text-white placeholder-[#a39cba] pl-12 pr-4 py-3.5 transition-all duration-200 ease-in-out shadow-sm" id="email" placeholder="Email or Phone Number" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<label class="sr-only" for="password">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#a39cba] group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="form-input block w-full rounded-xl bg-[#141022] border-transparent focus:border-primary focus:ring-0 text-white placeholder-[#a39cba] pl-12 pr-12 py-3.5 transition-all duration-200 ease-in-out shadow-sm" id="password" placeholder="Password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-[#a39cba] hover:text-white transition-colors cursor-pointer" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="text-sm font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-primary/25 transition-all duration-200 transform active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-white/10"></div>
<span class="flex-shrink-0 mx-4 text-xs font-medium text-gray-400 uppercase tracking-wider">Or continue with</span>
<div class="flex-grow border-t border-white/10"></div>
</div>
<!-- Google Button -->
<button class="w-full bg-white text-gray-900 font-medium py-3.5 rounded-xl border border-gray-200 hover:bg-gray-50 transition-all duration-200 transform active:scale-[0.98] flex items-center justify-center gap-3" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<!-- Footer Link -->
<div class="text-center pt-2">
<p class="text-sm text-gray-400">
                    New here? 
                    <a class="font-semibold text-primary hover:text-primary/80 transition-colors ml-1" href="#">Create an Account</a>
</p>
</div>
</div>
</main>
</body></html>
