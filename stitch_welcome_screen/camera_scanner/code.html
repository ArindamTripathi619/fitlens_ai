<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Camera Scanner</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#25c0f4",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101e22",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                    animation: {
                        'scan': 'scan 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%': { top: '0%', opacity: '0' },
                            '15%': { opacity: '1' },
                            '85%': { opacity: '1' },
                            '100%': { top: '100%', opacity: '0' },
                        }
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-black/30 backdrop-blur-md border border-white/10;
            }
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
            .material-symbols-filled {
                font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display text-white overflow-hidden h-screen w-full select-none">
<!-- Main Container -->
<div class="relative flex h-full w-full flex-col">
<!-- Simulated Camera Feed Background -->
<div class="absolute inset-0 z-0 bg-gray-900">
<!-- Using a gradient fallback if image fails, but mainly a food image -->
<img class="w-full h-full object-cover opacity-90" data-alt="Top down view of a healthy salad bowl with greens, tomatoes, and avocado on a table" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDM6_0fpYgqCVCgHyk6tNSBLOTACbdlGmcfmU9HeMM63Y2R474h_9SGSq6lBEhUO4Cwhnj4T2xJaETKcENY2Kueof6m5n89pp3PeGtV3v5bsb3-Jp6js4pMsjcWPoZrQEwr5eqvznJUUXIvLR-RJHBCAff-seRI0sj_EBJzPk5-FvgvLbfJny_1ZoC6s3NGhJoT52y_AVIefcgGPAn4EsPCqIF2DrNyeZnqwwm9fYSUdSiITfHEsw5_No9LRBBtyuePwsAvqWzaUY0"/>
<!-- Camera noise overlay effect for realism -->
<div class="absolute inset-0 opacity-[0.03] bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>
</div>
<!-- Top Gradient Overlay for Readability -->
<div class="absolute top-0 left-0 right-0 h-32 bg-gradient-to-b from-black/80 to-transparent z-10 pointer-events-none"></div>
<!-- Bottom Gradient Overlay for Readability -->
<div class="absolute bottom-0 left-0 right-0 h-80 bg-gradient-to-t from-background-dark via-background-dark/80 to-transparent z-10 pointer-events-none"></div>
<!-- UI Overlay Layer -->
<div class="relative z-20 flex flex-col h-full justify-between pt-6 pb-8">
<!-- Top Header -->
<header class="flex items-center justify-between px-5 py-2">
<button class="flex items-center justify-center w-10 h-10 rounded-full glass-panel active:scale-95 transition-transform text-white hover:bg-white/10">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h2 class="text-white text-lg font-bold tracking-tight drop-shadow-md">Scan Meal</h2>
<button class="flex items-center justify-center w-10 h-10 rounded-full glass-panel active:scale-95 transition-transform text-primary hover:bg-white/10">
<!-- Active state for flash -->
<span class="material-symbols-filled text-[20px]">flash_on</span>
</button>
</header>
<!-- Center Viewfinder Area -->
<main class="flex-1 flex flex-col items-center justify-center relative w-full px-8">
<!-- Scanning Frame/Reticle -->
<div class="relative w-full aspect-square max-w-[320px] rounded-[2rem]">
<!-- Scanner Corners -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-[4px] border-l-[4px] border-primary rounded-tl-[1.5rem] shadow-[0_0_15px_rgba(37,192,244,0.5)]"></div>
<div class="absolute top-0 right-0 w-12 h-12 border-t-[4px] border-r-[4px] border-primary rounded-tr-[1.5rem] shadow-[0_0_15px_rgba(37,192,244,0.5)]"></div>
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-[4px] border-l-[4px] border-primary rounded-bl-[1.5rem] shadow-[0_0_15px_rgba(37,192,244,0.5)]"></div>
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-[4px] border-r-[4px] border-primary rounded-br-[1.5rem] shadow-[0_0_15px_rgba(37,192,244,0.5)]"></div>
<!-- Scanning Laser Beam Animation -->
<div class="absolute left-4 right-4 h-[2px] bg-primary shadow-[0_0_20px_4px_rgba(37,192,244,0.6)] animate-scan rounded-full z-10"></div>
<!-- Focus Points (Decorative) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 border border-white/30 rounded-full"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 border border-white/10 rounded-full"></div>
<!-- AI Tag (Dynamic feedback) -->
<div class="absolute -bottom-16 left-0 right-0 flex justify-center">
<div class="glass-panel px-4 py-2 rounded-full flex items-center gap-3 animate-pulse-slow">
<span class="material-symbols-outlined text-primary text-[18px] animate-spin" style="animation-duration: 3s;">data_usage</span>
<span class="text-sm font-medium tracking-wide text-primary-50">Dosa detected (85%)</span>
</div>
</div>
</div>
<!-- Helper Text -->
<div class="mt-20 text-center">
<p class="text-white/60 text-sm font-medium tracking-wide drop-shadow-md">Align food within the frame for best results</p>
</div>
</main>
<!-- Bottom Controls Section -->
<footer class="flex flex-col gap-6 w-full px-6">
<!-- Mode Switcher (Segmented Control) -->
<div class="flex justify-center">
<div class="flex h-12 p-1 glass-panel rounded-full relative">
<!-- Active Background Pill (Positioned absolutely for animation logic, strictly CSS here) -->
<div class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] bg-primary rounded-full shadow-lg z-0"></div>
<label class="relative z-10 flex cursor-pointer w-28 items-center justify-center rounded-full text-background-dark font-bold text-sm leading-normal transition-colors">
<span>Food</span>
<input checked="" class="hidden" name="mode" type="radio" value="Food"/>
</label>
<label class="relative z-10 flex cursor-pointer w-28 items-center justify-center rounded-full text-white/70 hover:text-white font-medium text-sm leading-normal transition-colors">
<span>Barcode</span>
<input class="hidden" name="mode" type="radio" value="Barcode"/>
</label>
</div>
</div>
<!-- Main Camera Actions -->
<div class="flex items-center justify-between mt-2">
<!-- Gallery Upload (Left) -->
<button class="flex flex-col items-center justify-center gap-1 group">
<div class="flex items-center justify-center size-12 rounded-full glass-panel group-hover:bg-white/20 transition-all text-white">
<span class="material-symbols-outlined text-[24px]">photo_library</span>
</div>
</button>
<!-- Shutter Button (Center) -->
<button class="group relative flex items-center justify-center">
<!-- Outer Ring -->
<div class="size-20 rounded-full border-[4px] border-white/80 group-active:border-primary transition-colors duration-200"></div>
<!-- Inner Circle -->
<div class="absolute size-16 rounded-full bg-white group-hover:scale-90 group-active:scale-90 group-active:bg-primary transition-all duration-200 shadow-[0_0_20px_rgba(255,255,255,0.4)]"></div>
</button>
<!-- Manual Input / History (Right) -->
<button class="flex flex-col items-center justify-center gap-1 group">
<div class="flex items-center justify-center size-12 rounded-full glass-panel group-hover:bg-white/20 transition-all text-white">
<span class="material-symbols-outlined text-[24px]">edit_note</span>
</div>
</button>
</div>
</footer>
</div>
</div>
</body></html>
