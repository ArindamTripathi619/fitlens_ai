<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Serving Adjustment Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#25c0f4",
              "background-light": "#f5f8f8",
              "background-dark": "#101e22",
              "surface-dark": "#16262c",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            boxShadow: {
                'glow': '0 0 20px rgba(37, 192, 244, 0.5)',
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white h-screen overflow-hidden flex flex-col relative selection:bg-primary selection:text-black">
<!-- Top App Bar (Absolute Overlay) -->
<div class="fixed top-0 left-0 w-full z-20 p-4 pt-12 flex items-center justify-between pointer-events-none">
<button class="pointer-events-auto size-12 rounded-full bg-black/20 backdrop-blur-md flex items-center justify-center text-white border border-white/10 hover:bg-black/30 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="pointer-events-auto bg-black/20 backdrop-blur-md px-4 py-2 rounded-full border border-white/10">
<button class="text-white text-sm font-bold tracking-wide">Help</button>
</div>
</div>
<!-- Hero Image Area -->
<div class="relative w-full h-[55%] shrink-0">
<!-- Main Food Image -->
<div class="w-full h-full bg-cover bg-center" data-alt="Top down view of a bowl of Paneer Tikka Masala with vibrant orange curry" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAQ-ZLqJUb5wjqW2Oo84LsCI_-QEyFupq3IzjXrPIazdZkK_F5vrs18kejLxio3Dor6Lo_G4HAK02C3zre3WwNTrmI8BaO5Up7P0Hm1kORuts4b7T7L_22wI9i98khp_og1AE8B9DeLTMf07kAt6NB69KS4gigrTS_RPoEZIArl8U3zrTr2_DnP4eeS_eEZd-cQugkBO5G2gPhkunp9FpYH68e9YVCcnrn7CCy61Gpp8yYKgn_adYWGSFrs1LNLWr1PLOP4PY87PuQ');">
</div>
<!-- Gradient Overlay for better contrast at bottom -->
<div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-background-dark/90"></div>
<!-- AI Confidence Badge (Floating) -->
<div class="absolute top-[40%] right-6 translate-y-[-50%] flex flex-col items-end gap-2">
<div class="bg-black/40 backdrop-blur-lg px-4 py-2 rounded-xl flex items-center gap-3 border border-primary/30 shadow-lg animate-fade-in-up">
<div class="flex items-center justify-center size-8 rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined text-[18px]">auto_awesome</span>
</div>
<div class="flex flex-col">
<span class="text-[10px] uppercase text-white/60 font-bold tracking-widest">Confidence</span>
<span class="text-sm font-bold text-white">98% Match</span>
</div>
</div>
<!-- Bounding Box Indicator (Visual Flourish) -->
<div class="flex items-center gap-2 opacity-80">
<div class="h-[1px] w-8 bg-primary"></div>
<div class="size-2 rounded-full bg-primary shadow-glow"></div>
</div>
</div>
</div>
<!-- Result Card (Bottom Sheet) -->
<div class="relative z-10 flex-1 -mt-12 bg-background-light dark:bg-background-dark rounded-t-[2.5rem] shadow-[0_-8px_30px_rgba(0,0,0,0.4)] flex flex-col overflow-hidden ring-1 ring-white/5">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-5 pb-2">
<div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
<!-- Scrollable Content Container -->
<div class="flex-1 overflow-y-auto px-6 pb-8">
<!-- Header & Badges -->
<div class="flex flex-col gap-4 mb-8">
<div class="flex items-start justify-between">
<div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight">Paneer Tikka <br/><span class="text-slate-400 font-medium">Masala</span></h1>
</div>
</div>
<!-- Chips -->
<div class="flex flex-wrap gap-2">
<div class="flex h-8 items-center justify-center gap-x-2 rounded-full bg-primary/10 border border-primary/20 pl-3 pr-4">
<span class="material-symbols-outlined text-primary text-[18px]">check_circle</span>
<p class="text-primary text-xs font-bold uppercase tracking-wider">High Protein</p>
</div>
<div class="flex h-8 items-center justify-center gap-x-2 rounded-full bg-orange-500/10 border border-orange-500/20 pl-3 pr-4">
<span class="material-symbols-outlined text-orange-500 text-[18px]">warning</span>
<p class="text-orange-500 text-xs font-bold uppercase tracking-wider">High Sodium</p>
</div>
</div>
</div>
<!-- Portion Control Card -->
<div class="bg-white dark:bg-surface-dark p-6 rounded-[2rem] shadow-sm mb-6 border border-slate-200 dark:border-white/5">
<div class="flex justify-between items-end mb-6">
<div>
<p class="text-slate-500 dark:text-slate-400 text-sm font-bold uppercase tracking-wider mb-1">Serving Size</p>
<p class="text-xs text-slate-400 dark:text-slate-500">Slide to adjust</p>
</div>
<div class="text-right">
<span class="text-5xl font-bold text-primary tracking-tighter">1.5<span class="text-2xl ml-1 text-slate-400">x</span></span>
</div>
</div>
<!-- Slider Visual -->
<div class="relative w-full h-14 flex items-center select-none group">
<!-- Track Background -->
<div class="absolute w-full h-3 bg-slate-100 dark:bg-black/40 rounded-full overflow-hidden">
<!-- Active Track -->
<div class="h-full bg-gradient-to-r from-cyan-600 to-primary w-[50%]"></div>
</div>
<!-- Thumb -->
<div class="absolute left-[50%] -translate-x-1/2 w-8 h-8 bg-white rounded-full shadow-[0_0_15px_rgba(37,192,244,0.6)] border-[3px] border-primary z-10 cursor-ew-resize hover:scale-110 active:scale-95 transition-transform flex items-center justify-center">
<div class="size-2 rounded-full bg-primary"></div>
</div>
<!-- Tick Marks -->
<div class="absolute w-full top-9 flex justify-between px-1">
<span class="text-[10px] font-bold text-slate-400">0.5x</span>
<span class="text-[10px] font-bold text-slate-400">1.0x</span>
<span class="text-[10px] font-bold text-slate-900 dark:text-white">1.5x</span>
<span class="text-[10px] font-bold text-slate-400">2.0x</span>
<span class="text-[10px] font-bold text-slate-400">3.0x</span>
</div>
</div>
</div>
<!-- Live Macros Grid -->
<div class="grid grid-cols-4 gap-3 mb-8">
<!-- Calories (Primary Focus) -->
<div class="col-span-1 bg-white dark:bg-surface-dark rounded-2xl p-3 flex flex-col items-center justify-center gap-1 border border-slate-200 dark:border-white/5 shadow-sm">
<span class="text-lg font-bold text-slate-900 dark:text-white">450</span>
<span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Kcal</span>
</div>
<!-- Protein -->
<div class="col-span-1 bg-white dark:bg-surface-dark rounded-2xl p-3 flex flex-col items-center justify-center gap-1 border border-slate-200 dark:border-white/5 shadow-sm relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-primary/30"></div>
<span class="text-lg font-bold text-primary">28g</span>
<span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Prot</span>
</div>
<!-- Carbs -->
<div class="col-span-1 bg-white dark:bg-surface-dark rounded-2xl p-3 flex flex-col items-center justify-center gap-1 border border-slate-200 dark:border-white/5 shadow-sm">
<span class="text-lg font-bold text-slate-900 dark:text-white">12g</span>
<span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Carb</span>
</div>
<!-- Fat -->
<div class="col-span-1 bg-white dark:bg-surface-dark rounded-2xl p-3 flex flex-col items-center justify-center gap-1 border border-slate-200 dark:border-white/5 shadow-sm">
<span class="text-lg font-bold text-slate-900 dark:text-white">32g</span>
<span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Fat</span>
</div>
</div>
<!-- Confirm Button -->
<button class="w-full py-4 bg-primary hover:bg-cyan-400 active:scale-[0.98] transition-all rounded-full flex items-center justify-center gap-3 shadow-[0_8px_25px_rgba(37,192,244,0.3)] group mb-4">
<span class="text-black text-lg font-bold tracking-wide">Confirm &amp; Log</span>
<span class="material-symbols-outlined text-black font-bold group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<p class="text-center text-xs text-slate-500 dark:text-slate-600 font-medium">Results are estimates based on standard recipes.</p>
</div>
</div>
</body></html>
