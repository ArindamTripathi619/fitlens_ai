<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Body Composition Analysis</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#25c0f4",
              "primary-dark": "#009acb",
              "background-light": "#f5f8f8",
              "background-dark": "#101e22",
              "surface-dark": "#1a2c32",
              "surface-light": "#ffffff",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"],
              "body": ["Noto Sans", "sans-serif"],
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            boxShadow: {
              'glow': '0 0 20px -5px rgba(37, 192, 244, 0.5)',
              'glow-sm': '0 0 10px -2px rgba(37, 192, 244, 0.4)',
            }
          },
        },
      }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
            .range-thumb-glow {
                box-shadow: 0 0 0 4px rgba(37, 192, 244, 0.2);
            }
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #283539; 
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased selection:bg-primary selection:text-white">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto overflow-x-hidden shadow-2xl">
<!-- Header -->
<header class="flex items-center justify-between p-4 pt-6 z-10">
<button class="flex size-10 items-center justify-center rounded-full bg-surface-light/10 dark:bg-surface-dark hover:bg-surface-light/20 transition-colors">
<span class="material-symbols-outlined text-slate-700 dark:text-white">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center">Composition Analysis</h2>
<button class="flex size-10 items-center justify-center rounded-full bg-surface-light/10 dark:bg-surface-dark hover:bg-surface-light/20 transition-colors">
<span class="material-symbols-outlined text-slate-700 dark:text-white">history</span>
</button>
</header>
<!-- Main Content Scrollable Area -->
<main class="flex-1 overflow-y-auto pb-24 scroll-smooth">
<!-- Context Switcher -->
<div class="px-6 py-2">
<div class="flex h-12 w-full items-center justify-center rounded-full bg-surface-light dark:bg-surface-dark p-1 shadow-sm">
<label class="relative flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-primary has-[:checked]:text-background-dark has-[:checked]:shadow-glow-sm transition-all duration-300">
<span class="z-10 text-sm font-bold tracking-wide">Body Fat</span>
<input checked="" class="peer invisible w-0 absolute" name="view-mode" type="radio" value="Body Fat"/>
</label>
<label class="relative flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-primary has-[:checked]:text-background-dark has-[:checked]:shadow-glow-sm transition-all duration-300 text-slate-500 dark:text-slate-400">
<span class="z-10 text-sm font-bold tracking-wide">Water Weight</span>
<input class="peer invisible w-0 absolute" name="view-mode" type="radio" value="Water Weight"/>
</label>
</div>
</div>
<!-- Visualization Area -->
<div class="relative flex flex-col items-center justify-center py-8">
<!-- Decorative Glow Background -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Morphing Ring (Simulated with Gradient Border) -->
<div class="relative flex items-center justify-center w-64 h-64">
<!-- Outer Ring SVG for precise rendering -->
<svg class="absolute inset-0 w-full h-full -rotate-90 transform" viewbox="0 0 100 100">
<!-- Track -->
<circle cx="50" cy="50" fill="none" r="45" stroke="#1a2c32" stroke-width="8"></circle>
<!-- Progress (Simulating 18.5% roughly) -->
<circle class="drop-shadow-[0_0_10px_rgba(37,192,244,0.5)]" cx="50" cy="50" fill="none" r="45" stroke="#25c0f4" stroke-dasharray="283" stroke-dashoffset="230" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<!-- Inner Content -->
<div class="relative z-10 flex flex-col items-center justify-center text-center">
<span class="text-slate-400 text-xs font-medium uppercase tracking-widest mb-1">Body Fat</span>
<h1 class="text-5xl font-bold text-slate-900 dark:text-white tracking-tighter">18.5<span class="text-2xl text-primary">%</span></h1>
<div class="mt-3 px-4 py-1.5 rounded-full bg-green-500/20 border border-green-500/30 backdrop-blur-sm">
<span class="text-green-400 text-xs font-bold uppercase tracking-wider flex items-center gap-1">
<span class="material-symbols-outlined text-sm">check_circle</span>
                                Athletic
                            </span>
</div>
</div>
<!-- Floating Bubbles decoration -->
<div class="absolute top-4 right-10 size-3 rounded-full bg-primary/40 blur-[1px]"></div>
<div class="absolute bottom-8 left-8 size-4 rounded-full bg-primary/30 blur-[2px]"></div>
</div>
<!-- Secondary Metric Row -->
<div class="flex items-center justify-center gap-4 mt-2 w-full px-6">
<div class="flex-1 bg-surface-light dark:bg-surface-dark rounded-2xl p-3 flex flex-col items-center border border-slate-200 dark:border-slate-800">
<span class="text-slate-500 text-[10px] uppercase font-bold tracking-wider mb-1">Fat Mass</span>
<span class="text-slate-900 dark:text-white text-lg font-bold">13.4 <span class="text-sm text-slate-500 font-normal">kg</span></span>
</div>
<div class="flex-1 bg-surface-light dark:bg-surface-dark rounded-2xl p-3 flex flex-col items-center border border-slate-200 dark:border-slate-800">
<span class="text-slate-500 text-[10px] uppercase font-bold tracking-wider mb-1">Lean Mass</span>
<span class="text-slate-900 dark:text-white text-lg font-bold">62.1 <span class="text-sm text-slate-500 font-normal">kg</span></span>
</div>
</div>
</div>
<!-- Controls Section -->
<div class="px-6 space-y-6">
<!-- Gender Toggle -->
<div class="flex flex-col gap-2">
<span class="text-xs font-bold text-slate-500 uppercase tracking-widest pl-2">Biological Sex</span>
<div class="flex h-10 w-full items-center justify-center rounded-full bg-surface-light dark:bg-surface-dark p-1 border border-slate-200 dark:border-slate-800">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-slate-200 dark:has-[:checked]:bg-[#2c3e45] has-[:checked]:text-slate-900 dark:has-[:checked]:text-white transition-all text-slate-400 text-sm font-medium">
<span class="truncate">Male</span>
<input checked="" class="invisible w-0 absolute" name="gender" type="radio" value="Male"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-slate-200 dark:has-[:checked]:bg-[#2c3e45] has-[:checked]:text-slate-900 dark:has-[:checked]:text-white transition-all text-slate-400 text-sm font-medium">
<span class="truncate">Female</span>
<input class="invisible w-0 absolute" name="gender" type="radio" value="Female"/>
</label>
</div>
</div>
<!-- Sliders Container -->
<div class="bg-surface-light dark:bg-surface-dark rounded-3xl p-5 border border-slate-200 dark:border-slate-800 space-y-6 shadow-sm">
<!-- Height Slider -->
<div class="group">
<div class="flex items-end justify-between mb-2">
<label class="text-slate-900 dark:text-white text-sm font-medium">Height</label>
<span class="text-primary text-base font-bold">175 <span class="text-xs text-slate-500 font-normal">cm</span></span>
</div>
<div class="relative h-6 flex items-center">
<div class="absolute w-full h-1.5 bg-slate-200 dark:bg-[#2c3e45] rounded-full overflow-hidden">
<div class="h-full bg-primary w-[65%]"></div>
</div>
<div class="absolute left-[65%] size-5 bg-white rounded-full border-2 border-primary shadow-glow cursor-pointer hover:scale-110 transition-transform"></div>
</div>
</div>
<!-- Weight Slider -->
<div class="group">
<div class="flex items-end justify-between mb-2">
<label class="text-slate-900 dark:text-white text-sm font-medium">Weight</label>
<span class="text-primary text-base font-bold">70 <span class="text-xs text-slate-500 font-normal">kg</span></span>
</div>
<div class="relative h-6 flex items-center">
<div class="absolute w-full h-1.5 bg-slate-200 dark:bg-[#2c3e45] rounded-full overflow-hidden">
<div class="h-full bg-primary w-[45%]"></div>
</div>
<div class="absolute left-[45%] size-5 bg-white rounded-full border-2 border-primary shadow-glow cursor-pointer hover:scale-110 transition-transform"></div>
</div>
</div>
<!-- Neck Slider -->
<div class="group">
<div class="flex items-end justify-between mb-2">
<label class="text-slate-900 dark:text-white text-sm font-medium">Neck</label>
<span class="text-primary text-base font-bold">38 <span class="text-xs text-slate-500 font-normal">cm</span></span>
</div>
<div class="relative h-6 flex items-center">
<div class="absolute w-full h-1.5 bg-slate-200 dark:bg-[#2c3e45] rounded-full overflow-hidden">
<div class="h-full bg-primary w-[30%]"></div>
</div>
<div class="absolute left-[30%] size-5 bg-white rounded-full border-2 border-primary shadow-glow cursor-pointer hover:scale-110 transition-transform"></div>
</div>
</div>
<!-- Waist Slider -->
<div class="group">
<div class="flex items-end justify-between mb-2">
<label class="text-slate-900 dark:text-white text-sm font-medium">Waist</label>
<span class="text-primary text-base font-bold">82 <span class="text-xs text-slate-500 font-normal">cm</span></span>
</div>
<div class="relative h-6 flex items-center">
<div class="absolute w-full h-1.5 bg-slate-200 dark:bg-[#2c3e45] rounded-full overflow-hidden">
<div class="h-full bg-primary w-[55%]"></div>
</div>
<div class="absolute left-[55%] size-5 bg-white rounded-full border-2 border-primary shadow-glow cursor-pointer hover:scale-110 transition-transform"></div>
</div>
</div>
</div>
</div>
<div class="h-24"></div> <!-- Spacer for fixed footer -->
</main>
<!-- AI Insight Box (Fixed Bottom) -->
<div class="absolute bottom-4 left-4 right-4 z-20">
<div class="bg-surface-dark/95 dark:bg-[#1a2c32]/95 backdrop-blur-md rounded-2xl p-4 border border-primary/20 shadow-glow-sm flex items-start gap-3 transform transition-all hover:scale-[1.02] cursor-pointer">
<div class="flex-shrink-0 size-10 rounded-full bg-gradient-to-br from-primary to-blue-600 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-white" style="font-size: 20px;">auto_awesome</span>
</div>
<div class="flex-1">
<h4 class="text-white text-sm font-bold mb-0.5 flex items-center gap-2">
                        AI Insight
                        <span class="bg-primary/20 text-primary text-[10px] px-1.5 py-0.5 rounded-full uppercase tracking-wide">New</span>
</h4>
<p class="text-slate-300 text-xs leading-relaxed">
                        High sodium detected in yesterday's <span class="text-white font-medium">Pickle &amp; Papad</span> intake. Water retention is up by 2%. Drink +500ml water today.
                    </p>
</div>
<button class="text-slate-400 hover:text-white transition-colors">
<span class="material-symbols-outlined" style="font-size: 18px;">close</span>
</button>
</div>
</div>
</div>
</body></html>
