<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FitLens AI - Welcome</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#794dff",
                        "background-light": "#f6f5f8",
                        "background-dark": "#140f23",
                        "neon-pink": "#ff00cc",
                        "neon-blue": "#0055ff",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "heading": ["Poppins", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                },
            },
        }
    </script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Poppins:wght@600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Gradient Background logic to ensure vibrant minimalism */
        .bg-vibrant-gradient {
            background: radial-gradient(circle at 0% 0%, #0055ff 0%, transparent 50%), 
                        radial-gradient(circle at 100% 0%, #794dff 0%, transparent 50%), 
                        radial-gradient(circle at 100% 100%, #ff00cc 0%, transparent 50%),
                        radial-gradient(circle at 0% 100%, #140f23 0%, #140f23 100%);
            background-color: #140f23;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display antialiased text-white bg-background-dark overflow-x-hidden selection:bg-primary selection:text-white">
<div class="relative flex h-screen w-full flex-col overflow-hidden bg-vibrant-gradient group/design-root">
<!-- Background Elements / Visual Decor -->
<div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-neon-blue/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-neon-pink/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute top-[40%] left-[50%] transform -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/10 rounded-full blur-[80px] pointer-events-none"></div>
<!-- Main Content Area: Centered Vertically -->
<div class="flex-1 flex flex-col justify-center items-center px-6 relative z-10 w-full max-w-md mx-auto">

<div class="mb-8 animate-float">
<div class="relative w-28 h-28 flex items-center justify-center">
<!-- Glow effect -->
<div class="absolute inset-0 bg-gradient-to-tr from-neon-blue to-neon-pink rounded-full blur-xl opacity-60 animate-pulse-slow"></div>
<!-- Icon Container -->
<div class="relative w-full h-full bg-background-dark/80 backdrop-blur-xl rounded-full flex items-center justify-center border border-white/10 shadow-2xl">
<span class="material-symbols-outlined text-5xl text-transparent bg-clip-text bg-gradient-to-br from-white to-white/70">
                            health_and_safety
                        </span>
</div>
</div>
</div>
<!-- Headlines -->
<div class="text-center space-y-3">
<h1 class="font-heading text-4xl font-bold tracking-tight text-white drop-shadow-lg">
                    FitLens AI
                </h1>
<p class="text-lg text-white/80 font-medium leading-relaxed max-w-[280px] mx-auto">
                    Your AI-powered fitness companion
                </p>
</div>
</div>
<!-- Footer / Action Area -->
<div class="relative z-10 w-full px-6 pb-10 pt-4 max-w-md mx-auto">

<div class="flex flex-col gap-6">
<!-- Primary Action Button -->
<a href="signup.html" class="relative w-full group cursor-pointer overflow-hidden rounded-full p-[1px]">
<!-- Gradient Border -->
<div class="absolute inset-0 bg-gradient-to-r from-neon-blue via-primary to-neon-pink opacity-100 group-hover:opacity-80 transition-opacity"></div>
<!-- Button Content -->
<div class="relative flex h-14 items-center justify-center bg-primary hover:bg-primary/90 transition-colors rounded-full w-full">
<span class="text-white text-[17px] font-semibold tracking-wide">Get Started</span>
<span class="material-symbols-outlined ml-2 text-xl">arrow_forward</span>
</div>
</a>
<!-- Login Link -->
<div class="text-center">
<p class="text-white/60 text-sm font-medium">
                        Already have an account? 
                        <a class="text-white hover:text-primary transition-colors underline decoration-white/30 underline-offset-4 decoration-1" href="login.html">Log in</a>
</p>
</div>
</div>
</div>
</div>
